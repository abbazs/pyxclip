[package]
name = "pyxclip"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
homepage = "https://github.com/abbazs/pyxclip"
repository = "https://github.com/abbazs/pyxclip"
readme = "README.md"
include = [
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/src",
    "/python/pyxclip",
]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }

[profile.release]
lto = "thin"
strip = true
