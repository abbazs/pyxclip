[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project.urls]
Homepage = "https://github.com/abbazs/pyxclip"
Source = "https://github.com/abbazs/pyxclip"

[dependency-groups]
dev = ["maturin", "pytest"]

[tool.maturin]
python-source = "python"
module-name = "pyxclip._core"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = "tests"
